<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  .cell {
    position: fixed; width: 12.5%; height: 12.5%; box-sizing: border-box; display: none;
    border: 3px solid #00ff6a; border-radius: 4px;
  }
  #from { background: rgba(0, 255, 106, .32); }
  #to   { background: rgba(0, 255, 106, .55); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: inset 0 0 0 0 rgba(0,255,106,.0); } 50% { box-shadow: inset 0 0 18px 4px rgba(0,255,106,.8); } }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; display: none; }
</style>
</head>
<body>
  <svg id="arrow" viewBox="0 0 8 8" preserveAspectRatio="none">
    <defs>
      <marker id="head" markerWidth="4" markerHeight="4" refX="2.2" refY="2" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L4,2 L0,4 z" fill="#00ff6a" />
      </marker>
    </defs>
    <line id="line" stroke="#00ff6a" stroke-opacity=".75" stroke-width=".12" stroke-linecap="round" marker-end="url(#head)" />
  </svg>
  <div class="cell" id="from"></div>
  <div class="cell" id="to"></div>
  <script src="overlay.js"></script>
</body>
</html>
