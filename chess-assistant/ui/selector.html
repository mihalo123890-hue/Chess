<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  #banner {
    position: fixed; top: 28px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 17, 21, .92); color: #fff; padding: 14px 22px; border-radius: 14px;
    border: 1px solid rgba(0, 230, 118, .6); box-shadow: 0 8px 30px rgba(0,0,0,.5);
    font-size: 16px; line-height: 1.45; text-align: center; max-width: 720px;
  }
  #banner b { color: #00e676; }
  #banner small { display: block; color: #9aa4b2; margin-top: 4px; font-size: 13px; }
  #banner .warn { color: #ffb74d; margin-top: 6px; font-size: 14px; }
  #hx, #hy { position: fixed; background: rgba(0, 230, 118, .55); display: none; }
  #hx { left: 0; right: 0; height: 1px; }
  #hy { top: 0; bottom: 0; width: 1px; }
  #dot { position: fixed; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #00e676; box-shadow: 0 0 0 4px rgba(0,230,118,.3); display: none; }
  #rect {
    position: fixed; display: none; border: 2px solid #00e676; box-sizing: border-box;
    box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .45);
  }
  #size {
    position: fixed; display: none; background: #00e676; color: #04210f; font-weight: 700; font-size: 12px;
    padding: 2px 8px; border-radius: 6px;
  }
</style>
</head>
<body>
  <div id="hx"></div><div id="hy"></div>
  <div id="rect"></div>
  <div id="dot"></div>
  <div id="size"></div>
  <div id="banner"></div>
  <script src="selector.js"></script>
</body>
</html>
